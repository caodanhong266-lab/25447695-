.map::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.0) 50%,rgba(0,0,0,.06))}
.brand{position:absolute;z-index:30;top:22px;left:28px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);padding:10px 15px 10px 11px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.brand-mark{width:36px;height:36px;border-radius:12px;background:var(--yellow);display:grid;place-items:center;font-size:21px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.brand strong{font-size:15px;line-height:1.15}
.brand small{display:block;color:#8b847a;font-size:11px;margin-top:2px}
.top-actions{position:absolute;z-index:30;top:22px;right:28px;display:flex;gap:9px}
.icon-btn{border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.95);width:44px;height:44px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.1);font-size:19px}
.search{position:absolute;z-index:30;top:86px;left:28px;width:min(390px,calc(100vw - 56px));background:#fff;border-radius:17px;box-shadow:0 12px 32px rgba(0,0,0,.13);display:flex;align-items:center;padding:0 14px;gap:9px}
.search input{border:0;outline:0;width:100%;padding:13px 5px;font-size:14px;background:transparent}
.filter-row{position:absolute;z-index:30;top:143px;left:28px;display:flex;gap:8px;flex-wrap:wrap;max-width:480px}
.chip{border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.93);padding:8px 12px;border-radius:999px;font-size:12px;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.chip.active{background:var(--yellow);border-color:#f1bd00;font-weight:800}
.markers{position:absolute;inset:0;z-index:12}
.marker{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;transition:.18s;z-index:2}
.pin{position:relative;width:76px;height:64px;object-fit:contain;display:block;transform:none;border:0;background:transparent;box-shadow:none;border-radius:0}
.pin::before{content:none}
.pin::after{content:none}

function matches(s){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const text=(s.name+" "+s.price).toLowerCase();
  if(q && !text.includes(q)) return false;
  if(filter==="open" && s.status!=="營業中") return false;
  if(filter==="popular" && !s.popular) return false;
  if(filter==="cheap" && !s.price.includes("100") && !s.price.includes("150")) return false;
  return true;
}

const modal=document.getElementById("modal"), wheel=document.getElementById("wheel"), result=document.getElementById("result");
let wheelRotation=0, spinning=false, audioCtx=null;

function makeWheel(){
  const ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 300 300");
  const cx=150,cy=150,r=146,n=shops.length;
  const colors=["#ffd45a","#fff0b5","#7bd3aa","#ffe18a","#f6b6a5","#b9d9ee"];
  const shortName=name=>name.length>9?name.slice(0,8)+"…":name;
  for(let i=0;i<n;i++){
    const a0=(i/n)*Math.PI*2-Math.PI/2, a1=((i+1)/n)*Math.PI*2-Math.PI/2;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const path=document.createElementNS(ns,"path");
    path.setAttribute("d",`M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1} Z`);
    path.setAttribute("fill",colors[i%colors.length]); path.setAttribute("stroke","#fff"); path.setAttribute("stroke-width","2"); svg.appendChild(path);
    const am=(a0+a1)/2, tr=104;
    const t=document.createElementNS(ns,"text");
    t.setAttribute("x",cx+tr*Math.cos(am)); t.setAttribute("y",cy+tr*Math.sin(am));
    t.setAttribute("text-anchor","middle"); t.setAttribute("dominant-baseline","middle");
    t.setAttribute("font-size","9"); t.setAttribute("font-weight","800"); t.setAttribute("fill","#443b22");
    t.setAttribute("transform",`rotate(${am*180/Math.PI+90} ${cx+tr*Math.cos(am)} ${cy+tr*Math.sin(am)})`);
    t.textContent=shortName(shops[i].name); svg.appendChild(t);
  }
  wheel.innerHTML=""; wheel.appendChild(svg);
}

function beep(freq=620,duration=.08,type="sine",gain=.035){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);
  }catch(e){}
}

function playSpinSound(){
  let count=0;
  const timer=setInterval(()=>{beep(360+count*35,.045,"square",.022);count++;if(count>16)clearInterval(timer)},125);
}

document.getElementById("rouletteBtn").onclick=()=>{modal.classList.add("open");makeWheel();beep(520,.09,"sine",.03)};
document.getElementById("closeModal").onclick=()=>modal.classList.remove("open");
document.getElementById("spin").onclick=()=>{
  if(spinning)return;
  spinning=true;
  const i=Math.floor(Math.random()*shops.length);
  const n=shops.length, sector=360/n;
  // SVG 的第一格從正上方開始；把被選格的中心旋到正上方指針尖端。
  const target=(360-(i*sector+sector/2))+360*6;
  wheelRotation+=target;
  wheel.style.transform=`rotate(${wheelRotation}deg)`;
  result.textContent="正在轉動…";
  playSpinSound();
  setTimeout(()=>{
    result.innerHTML=`🎉 ${shops[i].name}<small style="display:block;font-size:13px;color:#777;margin-top:4px">今天就吃：${shops[i].product}</small>`;
    beep(880,.12,"sine",.04);setTimeout(()=>beep(1175,.16,"sine",.035),110);
    spinning=false;
  },4250);
};

const happyMelody = [
  523.25, 659.25, 783.99, 659.25, 587.33, 659.25, 880.00, 783.99,
  659.25, 587.33, 523.25, 587.33, 659.25, 783.99, 1046.50, 880.00
];

function musicNote(freq, start, duration, gain=.025, type="sine"){
  if(!audioCtx || !musicMaster) return;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(.0001,start);
  g.gain.exponentialRampToValueAtTime(gain,start+.025);
  g.gain.exponentialRampToValueAtTime(.0001,start+duration);
  o.connect(g); g.connect(musicMaster);
  o.start(start); o.stop(start+duration+.03);
}

function playMusicBar(){
  if(!musicOn || !audioCtx) return;
  const now=audioCtx.currentTime+.03;
  const beat=.34;
  for(let i=0;i<8;i++){
    const f=happyMelody[(musicStep+i)%happyMelody.length];
    musicNote(f,now+i*beat,beat*.82,.018,"triangle");
  }
  // 柔和的低音，讓整體有「暖暖的幸福感」
  const bass=[261.63,196.00,220.00,174.61][musicStep%4];
  musicNote(bass,now,beat*3.5,.012,"sine");
  // 小星星般的高音點綴
  const sparkle=[1046.5,1318.51,1174.66,1567.98][musicStep%4];
  musicNote(sparkle,now+beat*2.1,beat*.45,.009,"sine");
  musicStep=(musicStep+8)%happyMelody.length;
}

async function startHappyMusic(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") await audioCtx.resume();
    if(!musicMaster){
      musicMaster=audioCtx.createGain();
      musicMaster.gain.value=.42;
      musicMaster.connect(audioCtx.destination);
    }
    if(musicOn) return;
    musicOn=true;
    musicStep=0;
    playMusicBar();
    musicTimer=setInterval(playMusicBar,8*.34*1000);
    musicToggle.classList.add("on");
    musicToggle.innerHTML="🎵 <span>音樂播放中</span>";
  }catch(e){}
}

function stopHappyMusic(){
  musicOn=false;
  if(musicTimer){clearInterval(musicTimer);musicTimer=null;}
  musicToggle.classList.remove("on");
  musicToggle.innerHTML="🎵 <span>幸福音樂</span>";
}

const musicToggle=document.getElementById("musicToggle");
musicToggle.onclick=async ()=>{
  if(musicOn) stopHappyMusic();
  else await startHappyMusic();
};

// 使用者第一次與網站互動時，嘗試啟動音樂；若瀏覽器仍阻擋，
// 使用右下角的音樂按鈕即可開啟。
["pointerdown","keydown"].forEach(evt=>{
  document.addEventListener(evt,()=>{
    if(!musicOn) startHappyMusic();
  },{once:true});
});

</script>
